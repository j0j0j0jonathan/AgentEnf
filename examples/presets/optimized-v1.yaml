    \ input)\n   AND Classify(t, call_id, \"action_class\", \"privilege_escalation\")\n   AND Classify(t, call_id, \"priv_action\", \"change\")\n   AND ONCE [0, 600] (EXISTS t2, r2, c2, content2, exit_code2.\n        Turn(t2, r2, s)\n        AND NOT (t = t2)\n        AND ToolResult(t2, c2, content2, exit_code2)\n        AND Untrusted(t2, \"tool_result\")\n        AND Classify(t2, c2, \"content_risk\", \"instruction_like\")))\n  IMPLIES:R Approve(t, \"tool\", \"privilege_change_after_injection\"))\n}\n"
