- id: lateral_movement_v1
  enabled: true
  mfotl: "{\"lateral_tunnel\"}{\nALWAYS (FORALL t, call_id, tool, input.\n  (PolicyActive(t, \"lateral_movement_v1\")\n   AND ToolPlanned(t, call_id, tool, input)\n   AND Classify(t, call_id, \"action_class\", \"lateral_movement\")\n   AND Classify(t, call_id, \"lm_kind\", \"tunnel\"))\n  IMPLIES:R Block(t, \"tool\", \"lateral_tunnel\", \"port-forward or proxy tunnel to another service\"))\n}\n\nAND\n\n{\"pivot_after_credential\"}{\nALWAYS (FORALL t, rid, s, call_id, tool, input.\n  (PolicyActive(t, \"lateral_movement_v1\")\n   AND Turn(t, rid, s)\n   AND ToolPlanned(t, call_id, tool, input)\n   AND Classify(t, call_id, \"action_class\", \"lateral_movement\")\n   AND ONCE [0, 600] (EXISTS t1, r1, c1, tool1, input1.\n        PolicyActive(t1, \"lateral_movement_v1\")\n        AND Turn(t1, r1, s)\n        AND NOT (t = t1)\n        AND ToolPlanned(t1, c1, tool1, input1)\n        AND Classify(t1, c1, \"action_class\", \"credential_access\")))\n  IMPLIES:R Block(t, \"tool\", \"pivot_after_credential\"\
    , \"host pivot follows a credential access in this session\"))\n}\n\nAND\n\n{\"same_turn_credential_pivot\"}{\nALWAYS (FORALL t, call_id, tool, input.\n  (PolicyActive(t, \"lateral_movement_v1\")\n   AND ToolPlanned(t, call_id, tool, input)\n   AND Classify(t, call_id, \"action_class\", \"lateral_movement\")\n   AND Classify(t, call_id, \"lm_kind\", \"ssh_pivot\")\n   AND Classify(t, call_id, \"credential_kind\", \"ssh_key\"))\n  IMPLIES:R Block(t, \"tool\", \"same_turn_credential_pivot\", \"SSH pivot uses credential key material in the same command\"))\n}\n\nAND\n\n{\"internal_scan\"}{\nALWAYS (FORALL t, call_id, tool, input.\n  (PolicyActive(t, \"lateral_movement_v1\")\n   AND ToolPlanned(t, call_id, tool, input)\n   AND Classify(t, call_id, \"action_class\", \"lateral_movement\")\n   AND Classify(t, call_id, \"lm_kind\", \"internal_scan\"))\n  IMPLIES:R Warn(t, \"tool\", \"internal_scan\", \"high-speed internal network scan for pivot targets\"))\n}\n\nAND\n\n{\"remote_mount\"}{\n\
    ALWAYS (FORALL t, call_id, tool, input.\n  (PolicyActive(t, \"lateral_movement_v1\")\n   AND ToolPlanned(t, call_id, tool, input)\n   AND Classify(t, call_id, \"action_class\", \"lateral_movement\")\n   AND Classify(t, call_id, \"lm_kind\", \"smb\"))\n  IMPLIES:R Approve(t, \"tool\", \"remote_mount\"))\n}\n\nAND\n\n{\"ssh_pivot_visibility\"}{\nALWAYS (FORALL t, call_id, tool, input.\n  (PolicyActive(t, \"lateral_movement_v1\")\n   AND ToolPlanned(t, call_id, tool, input)\n   AND Classify(t, call_id, \"action_class\", \"lateral_movement\")\n   AND Classify(t, call_id, \"lm_kind\", \"ssh_pivot\"))\n  IMPLIES:R Warn(t, \"tool\", \"ssh_pivot_visibility\", \"SSH to another host (bare pivot, no key in command); flagged for visibility, the keyed/credential pivot is Blocked separately\"))\n}\n"
- id: collection_v1
  enabled: true
  mfotl: "{\"sensitive_staging\"}{\nALWAYS (FORALL t, call_id, tool, input.\n  (PolicyActive(t, \"collection_v1\")\n   AND ToolPlanned(t, call_id, tool, input)\n   AND Classify(t, call_id, \"action_class\", \"collection\")\n   AND Classify(t, call_id, \"collection_kind\", \"sensitive_copy\"))\n  IMPLIES:R Block(t, \"tool\", \"sensitive_staging\", \"copying credential or secret material into a staging location\"))\n}\n\nAND\n\n{\"account_file_staging\"}{\nALWAYS (FORALL t, call_id, tool, input.\n  (PolicyActive(t, \"collection_v1\")\n   AND ToolPlanned(t, call_id, tool, input)\n   AND Classify(t, call_id, \"action_class\", \"collection\")\n   AND Classify(t, call_id, \"collection_kind\", \"account_copy\"))\n  IMPLIES:R Block(t, \"tool\", \"account_file_staging\", \"copying /etc/passwd or /etc/group into a staging location\"))\n}\n\nAND\n\n{\"bulk_staging\"}{\nALWAYS (FORALL t, call_id, tool, input.\n  (PolicyActive(t, \"collection_v1\")\n   AND ToolPlanned(t, call_id, tool, input)\n   AND\
    \ Classify(t, call_id, \"action_class\", \"collection\")\n   AND (Classify(t, call_id, \"collection_kind\", \"archive\")\n        OR Classify(t, call_id, \"collection_kind\", \"database_dump\")\n        OR Classify(t, call_id, \"collection_kind\", \"log_dump\")))\n  IMPLIES:R Approve(t, \"tool\", \"bulk_staging\"))\n}\n\nAND\n\n{\"capture\"}{\nALWAYS (FORALL t, call_id, tool, input.\n  (PolicyActive(t, \"collection_v1\")\n   AND ToolPlanned(t, call_id, tool, input)\n   AND Classify(t, call_id, \"action_class\", \"collection\")\n   AND (Classify(t, call_id, \"collection_kind\", \"screenshot_capture\")\n        OR Classify(t, call_id, \"collection_kind\", \"clipboard_capture\")\n        OR Classify(t, call_id, \"collection_kind\", \"network_capture\")\n        OR Classify(t, call_id, \"collection_kind\", \"memory_dump\")))\n  IMPLIES:R Approve(t, \"tool\", \"capture\"))\n}\n\nAND\n\n{\"bulk_read\"}{\nALWAYS (FORALL t, call_id, tool, input.\n  (PolicyActive(t, \"collection_v1\")\n   AND\
    \ ToolPlanned(t, call_id, tool, input)\n   AND Classify(t, call_id, \"action_class\", \"collection\")\n   AND Classify(t, call_id, \"collection_kind\", \"bulk_read\"))\n  IMPLIES:R Warn(t, \"tool\", \"bulk_read\", \"recursive reading of many file contents\"))\n}\n\nAND\n\n{\"collection_after_credential\"}{\nALWAYS (FORALL t, rid, s, call_id, tool, input.\n  (PolicyActive(t, \"collection_v1\")\n   AND Turn(t, rid, s)\n   AND ToolPlanned(t, call_id, tool, input)\n   AND Classify(t, call_id, \"action_class\", \"collection\")\n   AND (Classify(t, call_id, \"collection_kind\", \"sensitive_copy\")\n        OR Classify(t, call_id, \"collection_kind\", \"system_config_copy\")\n        OR Classify(t, call_id, \"collection_kind\", \"account_copy\")\n        OR Classify(t, call_id, \"collection_kind\", \"archive\")\n        OR Classify(t, call_id, \"collection_kind\", \"database_dump\")\n        OR Classify(t, call_id, \"collection_kind\", \"log_dump\")\n        OR Classify(t, call_id, \"collection_kind\"\
    , \"screenshot_capture\")\n        OR Classify(t, call_id, \"collection_kind\", \"clipboard_capture\"))\n   AND ONCE [0, 600] (EXISTS t1, r1, c1, tool1, input1.\n        PolicyActive(t1, \"collection_v1\")\n        AND Turn(t1, r1, s)\n        AND NOT (t = t1)\n        AND ToolPlanned(t1, c1, tool1, input1)\n        AND Classify(t1, c1, \"action_class\", \"credential_access\")))\n  IMPLIES:R Approve(t, \"tool\", \"collection_after_credential\"))\n}\n\nAND\n\n{\"collection_after_account_enum\"}{\nALWAYS (FORALL t, rid, s, call_id, tool, input.\n  (PolicyActive(t, \"collection_v1\")\n   AND Turn(t, rid, s)\n   AND ToolPlanned(t, call_id, tool, input)\n   AND Classify(t, call_id, \"action_class\", \"collection\")\n   AND (Classify(t, call_id, \"collection_kind\", \"sensitive_copy\")\n        OR Classify(t, call_id, \"collection_kind\", \"system_config_copy\")\n        OR Classify(t, call_id, \"collection_kind\", \"account_copy\")\n        OR Classify(t, call_id, \"collection_kind\", \"\
    archive\")\n        OR Classify(t, call_id, \"collection_kind\", \"database_dump\")\n        OR Classify(t, call_id, \"collection_kind\", \"log_dump\")\n        OR Classify(t, call_id, \"collection_kind\", \"screenshot_capture\")\n        OR Classify(t, call_id, \"collection_kind\", \"clipboard_capture\"))\n   AND ONCE [0, 600] (EXISTS t1, r1, c1, tool1, input1.\n        PolicyActive(t1, \"collection_v1\")\n        AND Turn(t1, r1, s)\n        AND NOT (t = t1)\n        AND ToolPlanned(t1, c1, tool1, input1)\n        AND Classify(t1, c1, \"discovery_kind\", \"account\")))\n  IMPLIES:R Approve(t, \"tool\", \"collection_after_account_enum\"))\n}\n"
- id: exfiltration_v1
  enabled: true
  mfotl: "{\"exfil_dns_tunnel\"}{\nALWAYS (FORALL t, call_id, tool, input.\n  (PolicyActive(t, \"exfiltration_v1\")\n   AND ToolPlanned(t, call_id, tool, input)\n   AND Classify(t, call_id, \"action_class\", \"exfiltration\")\n   AND Classify(t, call_id, \"exfil_kind\", \"dns_tunnel\"))\n  IMPLIES:R Block(t, \"tool\", \"exfil_dns_tunnel\", \"DNS covert channel smuggling encoded data\"))\n}\n\nAND\n\n{\"exfil_icmp_tunnel\"}{\nALWAYS (FORALL t, call_id, tool, input.\n  (PolicyActive(t, \"exfiltration_v1\")\n   AND ToolPlanned(t, call_id, tool, input)\n   AND Classify(t, call_id, \"action_class\", \"exfiltration\")\n   AND Classify(t, call_id, \"exfil_kind\", \"icmp_tunnel\"))\n  IMPLIES:R Block(t, \"tool\", \"exfil_icmp_tunnel\", \"ICMP covert channel smuggling encoded data\"))\n}\n\nAND\n\n{\"exfil_authored_dataflow\"}{\nALWAYS (FORALL t, call_id, tool, input.\n  (PolicyActive(t, \"exfiltration_v1\")\n   AND ToolPlanned(t, call_id, tool, input)\n   AND Classify(t, call_id, \"action_class\"\
    , \"exfiltration\")\n   AND Classify(t, call_id, \"exfil_kind\", \"authored_exfil\"))\n  IMPLIES:R Block(t, \"tool\", \"exfil_authored_dataflow\", \"authored file writes code that reads a secret and sends it (deferred-execution exfiltration)\"))\n}\n\nAND\n\n{\"exfil_authored_egress\"}{\nALWAYS (FORALL t, call_id, tool, input.\n  (PolicyActive(t, \"exfiltration_v1\")\n   AND ToolPlanned(t, call_id, tool, input)\n   AND Classify(t, call_id, \"exfil_kind\", \"authored_egress\"))\n  IMPLIES:R Approve(t, \"tool\", \"exfil_authored_egress\"))\n}\n\nAND\n\n{\"exfil_authored_egress_after_sensitive_read\"}{\nALWAYS (FORALL t, rid, s, call_id, tool, input.\n  (PolicyActive(t, \"exfiltration_v1\")\n   AND Turn(t, rid, s)\n   AND ToolPlanned(t, call_id, tool, input)\n   AND Classify(t, call_id, \"exfil_kind\", \"authored_egress\")\n   AND ((ONCE [0, 600] (EXISTS t2, r2, c2, content2, exit_code2.\n            Turn(t2, r2, s)\n            AND NOT (t = t2)\n            AND ToolResult(t2, c2, content2,\
    \ exit_code2)\n            AND Classify(t2, c2, \"content_risk\", \"pii\")))\n        OR (ONCE [0, 600] (EXISTS t2, r2, c2, tool2, input2.\n            Turn(t2, r2, s)\n            AND NOT (t = t2)\n            AND ToolPlanned(t2, c2, tool2, input2)\n            AND Classify(t2, c2, \"path_sensitivity\", \"credentials\")))\n        OR (Classify(t, call_id, \"egress_payload\", \"sensitive\")\n            AND ONCE [0, 600] (EXISTS t2, r2, c2, content2, exit_code2.\n            Turn(t2, r2, s)\n            AND NOT (t = t2)\n            AND ToolResult(t2, c2, content2, exit_code2)\n            AND Classify(t2, c2, \"content_risk\", \"secret_material\")))))\n  IMPLIES:R Block(t, \"tool\", \"exfil_authored_egress_after_sensitive_read\", \"authored egress follows a PII or credential-path read, or a secret result plus a sender that binds that secret\"))\n}\n\nAND\n\n{\"c2_beacon\"}{\nALWAYS (FORALL t, call_id, tool, input.\n  (PolicyActive(t, \"exfiltration_v1\")\n   AND ToolPlanned(t, call_id,\
    \ tool, input)\n   AND Classify(t, call_id, \"action_class\", \"exfiltration\")\n   AND Classify(t, call_id, \"exfil_kind\", \"beacon\"))\n  IMPLIES:R Block(t, \"tool\", \"c2_beacon\", \"periodic outbound callback (command-and-control beaconing)\"))\n}\n\nAND\n\n{\"exfil_suspicious_sink\"}{\nALWAYS (FORALL t, call_id, tool, input.\n  (PolicyActive(t, \"exfiltration_v1\")\n   AND ToolPlanned(t, call_id, tool, input)\n   AND Classify(t, call_id, \"action_class\", \"exfiltration\")\n   AND Classify(t, call_id, \"network_risk\", \"suspicious\"))\n  IMPLIES:R Block(t, \"tool\", \"exfil_suspicious_sink\", \"data egress to a known suspicious/exfil sink\"))\n}\n\nAND\n\n{\"exfil_external_sink\"}{\nALWAYS (FORALL t, call_id, tool, input.\n  (PolicyActive(t, \"exfiltration_v1\")\n   AND ToolPlanned(t, call_id, tool, input)\n   AND Classify(t, call_id, \"action_class\", \"exfiltration\")\n   AND Classify(t, call_id, \"network_risk\", \"external\"))\n  IMPLIES:R Approve(t, \"tool\", \"exfil_external_sink\"\
    ))\n}\n\nAND\n\n{\"sensitive_path_exfiltration\"}{\nALWAYS (FORALL t, rid, s, call_id, tool, input.\n  (PolicyActive(t, \"exfiltration_v1\")\n   AND Turn(t, rid, s)\n   AND ToolPlanned(t, call_id, tool, input)\n   AND Classify(t, call_id, \"action_class\", \"exfiltration\")\n   AND (Classify(t, call_id, \"network_risk\", \"external\")\n        OR Classify(t, call_id, \"network_risk\", \"suspicious\"))\n   AND ONCE [0, 600] (EXISTS t2, r2, c2, tool2, input2.\n        Turn(t2, r2, s)\n        AND NOT (t = t2)\n        AND ToolPlanned(t2, c2, tool2, input2)\n        AND Classify(t2, c2, \"path_sensitivity\", \"credentials\")))\n  IMPLIES:R Block(t, \"tool\", \"sensitive_path_exfiltration\", \"sensitive read precedes external sink\"))\n}\n\nAND\n\n{\"credential_access_exfiltration\"}{\nALWAYS (FORALL t, rid, s, call_id, tool, input.\n  (PolicyActive(t, \"exfiltration_v1\")\n   AND Turn(t, rid, s)\n   AND ToolPlanned(t, call_id, tool, input)\n   AND Classify(t, call_id, \"action_class\",\
    \ \"exfiltration\")\n   AND (Classify(t, call_id, \"network_risk\", \"external\")\n        OR Classify(t, call_id, \"network_risk\", \"suspicious\"))\n   AND ONCE [0, 600] (EXISTS t2, r2, c2, tool2, input2.\n        Turn(t2, r2, s)\n        AND NOT (t = t2)\n        AND ToolPlanned(t2, c2, tool2, input2)\n        AND Classify(t2, c2, \"action_class\", \"credential_access\")))\n  IMPLIES:R Block(t, \"tool\", \"credential_access_exfiltration\", \"credential access precedes external sink\"))\n}\n\nAND\n\n{\"account_enum_exfiltration\"}{\nALWAYS (FORALL t, rid, s, call_id, tool, input.\n  (PolicyActive(t, \"exfiltration_v1\")\n   AND Turn(t, rid, s)\n   AND ToolPlanned(t, call_id, tool, input)\n   AND Classify(t, call_id, \"action_class\", \"exfiltration\")\n   AND (Classify(t, call_id, \"network_risk\", \"external\")\n        OR Classify(t, call_id, \"network_risk\", \"suspicious\"))\n   AND ONCE [0, 600] (EXISTS t2, r2, c2, tool2, input2.\n        Turn(t2, r2, s)\n        AND NOT (t =\
    \ t2)\n        AND ToolPlanned(t2, c2, tool2, input2)\n        AND Classify(t2, c2, \"discovery_kind\", \"account\")))\n  IMPLIES:R Block(t, \"tool\", \"account_enum_exfiltration\", \"account-file read precedes external sink\"))\n}\n\nAND\n\n{\"secret_result_exfiltration\"}{\nALWAYS (FORALL t, rid, s, call_id, tool, input.\n  (PolicyActive(t, \"exfiltration_v1\")\n   AND Turn(t, rid, s)\n   AND ToolPlanned(t, call_id, tool, input)\n   AND Classify(t, call_id, \"action_class\", \"exfiltration\")\n   AND (Classify(t, call_id, \"network_risk\", \"external\")\n        OR Classify(t, call_id, \"network_risk\", \"suspicious\"))\n   AND ONCE [0, 600] (EXISTS t2, r2, c2, content2, exit_code2.\n        Turn(t2, r2, s)\n        AND NOT (t = t2)\n        AND ToolResult(t2, c2, content2, exit_code2)\n        AND Classify(t2, c2, \"content_risk\", \"secret_material\")))\n  IMPLIES:R Block(t, \"tool\", \"secret_result_exfiltration\", \"secret material observed before external sink\"))\n}\n"
- id: impact_v1
  enabled: true
  mfotl: "{\"destructive_impact\"}{\nALWAYS (FORALL t, call_id, tool, input.\n  (PolicyActive(t, \"impact_v1\")\n   AND ToolPlanned(t, call_id, tool, input)\n   AND Classify(t, call_id, \"action_class\", \"impact\")\n   AND (Classify(t, call_id, \"impact_kind\", \"fork_bomb\")\n        OR Classify(t, call_id, \"impact_kind\", \"disk_destruction\")\n        OR Classify(t, call_id, \"impact_kind\", \"resource_exhaustion\")\n        OR Classify(t, call_id, \"impact_kind\", \"destructive_protected\")\n        OR Classify(t, call_id, \"impact_kind\", \"process_kill\")\n        OR Classify(t, call_id, \"impact_kind\", \"db_destruction\")\n        OR Classify(t, call_id, \"impact_kind\", \"encryption\")\n        OR Classify(t, call_id, \"impact_kind\", \"authored_destructive_script\")\n        OR Classify(t, call_id, \"impact_kind\", \"authored_sandbox_escape_script\")))\n  IMPLIES:R Block(t, \"tool\", \"destructive_impact\", \"destructive, exhaustion, process-kill, encryption, or authored escape\
    \ operation\"))\n}\n\nAND\n\n{\"ops_tree_delete_approval\"}{\nALWAYS (FORALL t, call_id, tool, input.\n  (PolicyActive(t, \"impact_v1\")\n   AND ToolPlanned(t, call_id, tool, input)\n   AND Classify(t, call_id, \"impact_kind\", \"destructive_ops_tree\"))\n  IMPLIES:R Approve(t, \"tool\", \"ops_tree_delete\"))\n}\n\nAND\n\n{\"ops_tree_wipe_after_untrusted_instruction\"}{\nALWAYS (FORALL t, rid, s, call_id, tool, input.\n  (PolicyActive(t, \"impact_v1\")\n   AND Turn(t, rid, s)\n   AND ToolPlanned(t, call_id, tool, input)\n   AND Classify(t, call_id, \"impact_kind\", \"destructive_ops_tree\")\n   AND ONCE [0, 600] (EXISTS t2, r2, c2, content2, exit_code2.\n        Turn(t2, r2, s)\n        AND NOT (t = t2)\n        AND ToolResult(t2, c2, content2, exit_code2)\n        AND Untrusted(t2, \"tool_result\")\n        AND Classify(t2, c2, \"content_risk\", \"instruction_like\")))\n  IMPLIES:R Block(t, \"tool\", \"ops_tree_wipe_after_untrusted_instruction\", \"operational logs, backups, or data\
    \ are recursively deleted after an untrusted instruction\"))\n}\n\nAND\n\n{\"service_stop_approval\"}{\nALWAYS (FORALL t, call_id, tool, input.\n  (PolicyActive(t, \"impact_v1\")\n   AND ToolPlanned(t, call_id, tool, input)\n   AND Classify(t, call_id, \"action_class\", \"impact\")\n   AND Classify(t, call_id, \"impact_kind\", \"service_stop\"))\n  IMPLIES:R Approve(t, \"tool\", \"service_stop\"))\n}\n\nAND\n\n{\"authored_unbounded_loop\"}{\nALWAYS (FORALL t, call_id, tool, input.\n  (PolicyActive(t, \"impact_v1\")\n   AND ToolPlanned(t, call_id, tool, input)\n   AND Classify(t, call_id, \"action_class\", \"impact\")\n   AND Classify(t, call_id, \"impact_kind\", \"authored_unbounded_loop\"))\n  IMPLIES:R Warn(t, \"tool\", \"authored_unbounded_loop\", \"authored poll loop with no exit path; the write is dual-use, executing it is blocked\"))\n}\n\nAND\n\n{\"file_delete_approval\"}{\nALWAYS (FORALL t, call_id, tool, input.\n  (PolicyActive(t, \"impact_v1\")\n   AND ToolPlanned(t, call_id,\
    \ tool, input)\n   AND Classify(t, call_id, \"file_action\", \"delete\"))\n  IMPLIES:R Approve(t, \"tool\", \"file_delete\"))\n}\n\nAND\n\n{\"file_delete_burst\"}{\nALWAYS (FORALL t, rid, s, call_id, tool, input.\n  (PolicyActive(t, \"impact_v1\")\n   AND Turn(t, rid, s)\n   AND ToolPlanned(t, call_id, tool, input)\n   AND Classify(t, call_id, \"file_action\", \"delete\")\n   AND (EXISTS dcnt.\n     dcnt <- CNT(t2; s;\n       ONCE [0, 60] (EXISTS r2, c2, content2, exit_code2.\n         Turn(t2, r2, s)\n         AND ToolResult(t2, c2, content2, exit_code2)\n         AND ONCE [0, 60] (EXISTS t3, r3, tool3, input3.\n           Turn(t3, r3, s)\n           AND ToolPlanned(t3, c2, tool3, input3)\n           AND Classify(t3, c2, \"file_action\", \"delete\"))))\n     AND dcnt >= 5))\n  IMPLIES:R Block(t, \"tool\", \"file_delete_burst\", \"five files were deleted in this session during the last minute\"))\n}\n"
- id: provenance_v1
  enabled: true
  mfotl: "{\"untrusted_write_then_exec\"}{\nALWAYS (FORALL t, rid, s, call_id, tool, input, p.\n  (PolicyActive(t, \"provenance_v1\")\n   AND Turn(t, rid, s)\n   AND ToolPlanned(t, call_id, tool, input)\n   AND Classify(t, call_id, \"exec_path\", p)\n   AND ONCE [0, 600] (EXISTS t2, r2, c2.\n        Turn(t2, r2, s)\n        AND Classify(t2, c2, \"untrusted_write_path\", p)))\n  IMPLIES:R Approve(t, \"tool\", \"provenance_exec\"))\n}\n\nAND\n\n{\"egress_source_then_exec\"}{\nALWAYS (FORALL t, rid, s, call_id, tool, input, p.\n  (PolicyActive(t, \"provenance_v1\")\n   AND Turn(t, rid, s)\n   AND ToolPlanned(t, call_id, tool, input)\n   AND Classify(t, call_id, \"exec_path\", p)\n   AND ONCE [0, 600] (EXISTS t2, r2, c2.\n        Turn(t2, r2, s)\n        AND Classify(t2, c2, \"egress_source_path\", p)))\n  IMPLIES:R Approve(t, \"tool\", \"egress_source_then_exec\"))\n}\n\nAND\n\n{\"egress_source_then_exec_after_sensitive\"}{\nALWAYS (FORALL t, rid, s, call_id, tool, input, p.\n  (PolicyActive(t,\
    \ \"provenance_v1\")\n   AND Turn(t, rid, s)\n   AND ToolPlanned(t, call_id, tool, input)\n   AND Classify(t, call_id, \"exec_path\", p)\n   AND ONCE [0, 600] (EXISTS t2, r2, c2.\n        Turn(t2, r2, s)\n        AND Classify(t2, c2, \"egress_source_path\", p))\n   AND ONCE [0, 600] (EXISTS t3, r3, c3, tool3, input3.\n        Turn(t3, r3, s)\n        AND ToolPlanned(t3, c3, tool3, input3)\n        AND (Classify(t3, c3, \"action_class\", \"credential_access\")\n             OR Classify(t3, c3, \"discovery_kind\", \"account\")\n             OR Classify(t3, c3, \"content_risk\", \"secret_material\"))))\n  IMPLIES:R Approve(t, \"tool\", \"egress_source_then_exec_after_sensitive\"))\n}\n\nAND\n\n{\"unbounded_loop_then_exec\"}{\nALWAYS (FORALL t, rid, s, call_id, tool, input, p.\n  (PolicyActive(t, \"provenance_v1\")\n   AND Turn(t, rid, s)\n   AND ToolPlanned(t, call_id, tool, input)\n   AND Classify(t, call_id, \"exec_path\", p)\n   AND ONCE [0, 600] (EXISTS t2, r2, c2.\n        Turn(t2,\
    \ r2, s)\n        AND Classify(t2, c2, \"loop_source_path\", p)))\n  IMPLIES:R Approve(t, \"tool\", \"unbounded_loop_then_exec\"))\n}\n\nAND\n\n{\"chmod_exec_after_authored\"}{\nALWAYS (FORALL t, rid, s, call_id, tool, input, p.\n  (PolicyActive(t, \"provenance_v1\")\n   AND Turn(t, rid, s)\n   AND ToolPlanned(t, call_id, tool, input)\n   AND Classify(t, call_id, \"chmod_exec_path\", p)\n   AND ONCE [0, 600] (EXISTS t2, r2, c2.\n        Turn(t2, r2, s)\n        AND (Classify(t2, c2, \"egress_source_path\", p)\n             OR Classify(t2, c2, \"untrusted_write_path\", p)\n             OR Classify(t2, c2, \"loop_source_path\", p))))\n  IMPLIES:R Approve(t, \"tool\", \"chmod_exec_after_authored\"))\n}\n\nAND\n\n{\"provenance_hook_payload\"}{\nALWAYS (FORALL t, rid, s, call_id, tool, input, p.\n  (PolicyActive(t, \"provenance_v1\")\n   AND Turn(t, rid, s)\n   AND ToolPlanned(t, call_id, tool, input)\n   AND Classify(t, call_id, \"dangerous_authored_write_path\", p)\n   AND ONCE [0, 600]\
    \ (EXISTS t2, r2, c2.\n        Turn(t2, r2, s)\n        AND Classify(t2, c2, \"deferred_hook_path\", p)))\n  IMPLIES:R Approve(t, \"tool\", \"provenance_hook_payload\"))\n}\n\nAND\n\n{\"external_git_remote_push\"}{\nALWAYS (FORALL t, rid, s, call_id, tool, input, remote.\n  (PolicyActive(t, \"provenance_v1\")\n   AND Turn(t, rid, s)\n   AND ToolPlanned(t, call_id, tool, input)\n   AND Classify(t, call_id, \"git_push_remote\", remote)\n   AND ONCE [0, 600] (EXISTS t2, r2, c2.\n        Turn(t2, r2, s)\n        AND Classify(t2, c2, \"git_external_remote\", remote)))\n  IMPLIES:R Block(t, \"tool\", \"external_git_push\", \"push sends repository content to an external remote configured earlier in this session\"))\n}\n\nAND\n\n{\"external_git_remote_add\"}{\nALWAYS (FORALL t, call_id, tool, input, remote.\n  (PolicyActive(t, \"provenance_v1\")\n   AND ToolPlanned(t, call_id, tool, input)\n   AND Classify(t, call_id, \"git_external_remote\", remote))\n  IMPLIES:R Approve(t, \"tool\", \"external_git_remote_add\"\
    ))\n}\n\nAND\n\n{\"control_artifact_write_skill\"}{\nALWAYS (FORALL t, call_id, tool, input.\n  (PolicyActive(t, \"provenance_v1\")\n   AND ToolPlanned(t, call_id, tool, input)\n   AND (Classify(t, call_id, \"control_artifact_write\", \"agent_skill\")\n        OR Classify(t, call_id, \"control_artifact_write\", \"openclaw_skill\")))\n  IMPLIES:R Approve(t, \"tool\", \"control_artifact_write_skill\"))\n}\n\nAND\n\n{\"control_artifact_write\"}{\nALWAYS (FORALL t, call_id, tool, input.\n  (PolicyActive(t, \"provenance_v1\")\n   AND ToolPlanned(t, call_id, tool, input)\n   AND (EXISTS a. Classify(t, call_id, \"control_artifact_write\", a))\n   AND NOT Classify(t, call_id, \"control_artifact_write\", \"agent_skill\")\n   AND NOT Classify(t, call_id, \"control_artifact_write\", \"openclaw_skill\"))\n  IMPLIES:R Block(t, \"tool\", \"control_artifact_write\", \"write to an evaluation, scoring, or enforcer control artifact (agent self-tampering)\"))\n}\n\nAND\n\n{\"control_artifact_read\"}{\n\
    ALWAYS (FORALL t, call_id, tool, input.\n  (PolicyActive(t, \"provenance_v1\")\n   AND ToolPlanned(t, call_id, tool, input)\n   AND (EXISTS a. Classify(t, call_id, \"control_artifact_read\", a)))\n  IMPLIES:R Approve(t, \"tool\", \"control_artifact_read\"))\n}\n\nAND\n\n{\"openclaw_private_control_read_after_untrusted\"}{\nALWAYS (FORALL t, rid, s, call_id, tool, input.\n  (PolicyActive(t, \"provenance_v1\")\n   AND Turn(t, rid, s)\n   AND ToolPlanned(t, call_id, tool, input)\n   AND Classify(t, call_id, \"control_artifact_read\", \"openclaw_private_control\")\n   AND ONCE [0, 600] (EXISTS t2, r2, c2.\n        Turn(t2, r2, s)\n        AND NOT (t = t2)\n        AND Untrusted(t2, \"tool_result\")\n        AND Classify(t2, c2, \"content_risk\", \"instruction_like\")))\n  IMPLIES:R Block(t, \"tool\", \"openclaw_private_control_read_after_untrusted\", \"read of OpenClaw's reserved private control files after untrusted instruction-like content\"))\n}\n\nAND\n\n{\"oversized_untrusted_result_review\"\
    }{\nALWAYS (FORALL t, r, s, c, tool, input.\n  (PolicyActive(t, \"provenance_v1\")\n   AND Turn(t, r, s) AND ToolPlanned(t, c, tool, input)\n   AND (Classify(t, c, \"action_class\", \"privilege_escalation\")\n        OR Classify(t, c, \"action_class\", \"exfiltration\")\n        OR Classify(t, c, \"action_class\", \"persistence\")\n        OR Classify(t, c, \"action_class\", \"execution\")\n        OR Classify(t, c, \"action_class\", \"credential_access\"))\n   AND ONCE [0, 86400] (EXISTS t1, r1, c1.\n     Turn(t1, r1, s) AND Untrusted(t1, \"tool_result\")\n     AND Classify(t1, c1, \"judge_adapter\", \"content_semantics\")\n     AND Classify(t1, c1, \"judge_status\", \"input_budget_exceeded\")))\n  IMPLIES:R Approve(t, \"tool\", \"oversized_untrusted_result_review\"))\n}\n"
- id: critical_safety_net_v1
  enabled: true
  mfotl: "{\"critical_command_backstop\"}{\nALWAYS (FORALL t, call_id, tool, input.\n  (PolicyActive(t, \"critical_safety_net_v1\")\n   AND ToolPlanned(t, call_id, tool, input)\n   AND (Classify(t, call_id, \"tool_family\", \"shell\")\n        OR Classify(t, call_id, \"tool_family\", \"code\"))\n   AND Classify(t, call_id, \"command_risk\", \"critical\"))\n  IMPLIES:R Block(t, \"tool\", \"critical_command_backstop\", \"command rated critical risk: deterministic backstop so a critical action is hard-blocked (F4)\"))\n}\n"
- id: external_judge
  enabled: false
  mfotl: "ALWAYS (FORALL t, call_id, tool, input.\n  (PolicyActive(t, \"external_judge\")\n   AND ToolPlanned(t, call_id, tool, input)\n   AND is_forbidden(input) > 0.5)\n  IMPLIES:R Block(t, \"tool\", \"external_judge_forbidden\", \"external judge classified planned tool use as an attack\"))\n"
- id: coverage_v1
  enabled: true
  mfotl: "{\"extension_state_change\"}{\nALWAYS (FORALL t, call_id, tool, input.\n  (PolicyActive(t, \"coverage_v1\")\n   AND ToolPlanned(t, call_id, tool, input)\n   AND Classify(t, call_id, \"extension_tool\", \"skill\")\n   AND (Classify(t, call_id, \"extension_action\", \"create\")\n        OR Classify(t, call_id, \"extension_action\", \"install\")\n        OR Classify(t, call_id, \"extension_action\", \"update\")\n        OR Classify(t, call_id, \"extension_action\", \"delete\")\n        OR Classify(t, call_id, \"extension_action\", \"stage\")))\n  IMPLIES:R Approve(t, \"tool\", \"extension_state_change\"))\n}\n\nAND\n\n{\"untrusted_skill_install\"}{\nALWAYS (FORALL t, rid, s, call_id, tool, input.\n  (PolicyActive(t, \"coverage_v1\")\n   AND Turn(t, rid, s)\n   AND ToolPlanned(t, call_id, tool, input)\n   AND Classify(t, call_id, \"extension_tool\", \"skill\")\n   AND (Classify(t, call_id, \"extension_action\", \"install\")\n        OR Classify(t, call_id, \"extension_action\", \"\
    create\")\n        OR Classify(t, call_id, \"extension_action\", \"stage\"))\n   AND ONCE [0, 600] (EXISTS t2, r2, c2, content, exit_code.\n        Turn(t2, r2, s)\n        AND NOT (t = t2)\n        AND ToolResult(t2, c2, content, exit_code)\n        AND Untrusted(t2, \"tool_result\")\n        AND Classify(t2, c2, \"content_risk\", \"instruction_like\")))\n  IMPLIES:R Approve(t, \"tool\", \"untrusted_skill_install\"))\n}\n\nAND\n\n{\"untrusted_skill_use\"}{\nALWAYS (FORALL t, rid, s, call_id, tool, input.\n  (PolicyActive(t, \"coverage_v1\")\n   AND Turn(t, rid, s)\n   AND ToolPlanned(t, call_id, tool, input)\n   AND Classify(t, call_id, \"extension_tool\", \"skill\")\n   AND Classify(t, call_id, \"extension_action\", \"use\")\n   AND ONCE [0, 600] (EXISTS t2, r2, c2, content, exit_code.\n        Turn(t2, r2, s)\n        AND NOT (t = t2)\n        AND ToolResult(t2, c2, content, exit_code)\n        AND Untrusted(t2, \"tool_result\")\n        AND Classify(t2, c2, \"content_risk\", \"instruction_like\"\
    )))\n  IMPLIES:R Block(t, \"tool\", \"untrusted_skill_use\", \"skill use follows untrusted instruction-like content\"))\n}\n\nAND\n\n{\"control_plane_update\"}{\nALWAYS (FORALL t, call_id, tool, input.\n  (PolicyActive(t, \"coverage_v1\")\n   AND ToolPlanned(t, call_id, tool, input)\n   AND Classify(t, call_id, \"control_plane_action\", \"update\"))\n  IMPLIES:R Approve(t, \"tool\", \"control_plane_update\"))\n}\n\nAND\n\n{\"device_pairing\"}{\nALWAYS (FORALL t, call_id, tool, input.\n  (PolicyActive(t, \"coverage_v1\")\n   AND ToolPlanned(t, call_id, tool, input)\n   AND Classify(t, call_id, \"device_action\", \"pair\"))\n  IMPLIES:R Approve(t, \"tool\", \"device_pairing\"))\n}\n\nAND\n\n{\"judge_classified_action\"}{\nALWAYS (FORALL t, call_id, tool, input.\n  (PolicyActive(t, \"coverage_v1\")\n   AND ToolPlanned(t, call_id, tool, input)\n   AND Classify(t, call_id, \"judge_status\", \"classified\")\n   AND NOT Classify(t, call_id, \"action_class\", \"benign\"))\n  IMPLIES:R Approve(t,\
    \ \"tool\", \"judge_classified_action\"))\n}\n\nAND\n\n{\"unclassified_action\"}{\nALWAYS (FORALL t, call_id, tool, input.\n  (PolicyActive(t, \"coverage_v1\")\n   AND ToolPlanned(t, call_id, tool, input)\n   AND Classify(t, call_id, \"tool_status\", \"unclassified\"))\n  IMPLIES:R Approve(t, \"tool\", \"unclassified_action\"))\n}\n\nAND\n\n{\"uncertain_action\"}{\nALWAYS (FORALL t, call_id, tool, input.\n  (PolicyActive(t, \"coverage_v1\")\n   AND ToolPlanned(t, call_id, tool, input)\n   AND Classify(t, call_id, \"tool_status\", \"uncertain\")\n   AND NOT Classify(t, call_id, \"judge_status\", \"classified\"))\n  IMPLIES:R Approve(t, \"tool\", \"uncertain_action\"))\n}\n\nAND\n{\"unresolved_skill_stage_review\"}{\nALWAYS (FORALL t,c,tool,input.\n (PolicyActive(t,\"coverage_v1\") AND ToolPlanned(t,c,tool,input)\n  AND Classify(t,c,\"skill_stage_status\",\"unresolved\"))\n IMPLIES:R Approve(t,\"tool\",\"unresolved_skill_stage_review\"))\n}\n"
- id: configuration_review_v2
  enabled: true
  mfotl: "{\"configuration_capability_review\"}{\nALWAYS (FORALL t, c, tool, input.\n  (PolicyActive(t, \"configuration_review_v2\")\n   AND ToolPlanned(t, c, tool, input)\n   AND Classify(t, c, \"artifact_write\", \"configuration\")\n   AND NOT Classify(t, c, \"configuration_change\", \"benign\"))\n  IMPLIES:R Approve(t, \"tool\", \"configuration_capability_review\"))\n}\n"
- id: artifact_provenance_v3
  enabled: true
  mfotl: "\n{\"confirmed_dangerous_artifact_use\"}{\nALWAYS (FORALL t,c,tool,input,path.\n (PolicyActive(t, \"artifact_provenance_v3\") AND ToolPlanned(t,c,tool,input)\n  AND Classify(t,c,\"artifact_present_dangerous_path_v3\",path))\n IMPLIES:R Block(t,\"tool\",\"confirmed_dangerous_artifact_use\",\"use targets a runtime-attested dangerous revision\"))\n}\nAND\n{\"attempted_dangerous_artifact_review\"}{\nALWAYS (FORALL t,c,tool,input,path.\n (PolicyActive(t, \"artifact_provenance_v3\") AND ToolPlanned(t,c,tool,input)\n  AND Classify(t,c,\"artifact_attempted_dangerous_path_v3\",path))\n IMPLIES:R Approve(t,\"tool\",\"attempted_dangerous_artifact_review\"))\n}\nAND\n{\"unverified_artifact_state_review\"}{\nALWAYS (FORALL t,c,tool,input,reason.\n (PolicyActive(t, \"artifact_provenance_v3\") AND ToolPlanned(t,c,tool,input)\n  AND Classify(t,c,\"artifact_state_unresolved\",reason))\n IMPLIES:R Approve(t,\"tool\",\"unverified_artifact_state_review\"))\n}\nAND\n{\"authored_fragment_history_review\"\
    }{\nALWAYS (FORALL t,c,tool,input,kind.\n (PolicyActive(t, \"artifact_provenance_v3\") AND ToolPlanned(t,c,tool,input)\n  AND Classify(t,c,\"authored_history_risk\",kind))\n IMPLIES:R Approve(t,\"tool\",\"authored_fragment_history_review\"))\n}\nAND\n{\"authored_dataflow_review\"}{\nALWAYS (FORALL t,c,tool,input.\n (PolicyActive(t, \"artifact_provenance_v3\") AND ToolPlanned(t,c,tool,input)\n  AND Classify(t,c,\"authored_dataflow_status\",\"unresolved\"))\n IMPLIES:R Approve(t,\"tool\",\"authored_dataflow_review\"))\n}\n"
