    \ call_id, \"action_class\", \"defense_evasion\")\n   AND Classify(t, call_id, \"evasion_kind\", \"anti_audit\")\n   AND ONCE [0, 600] (EXISTS t1, r1, ph, cat, rsn.\n        Turn(t1, r1, s)\n        AND NOT (t = t1)\n        AND Block(t1, ph, cat, rsn)\n        ))\n  IMPLIES:R Warn(t, \"tool\", \"postblock_anti_audit\", \"log/trace cleanup after a prior block in session; advisory, escalating to Block off any prior block cascades a single benign false positive into several, and on A3S this tier never caught an attack. The base anti_audit Warn still flags the cleanup\"))\n}\n\nAND\n\n{\"obfuscation\"}{\nALWAYS (FORALL t, call_id, tool, input.\n  (PolicyActive(t, \"defense_evasion_v1\")\n   AND ToolPlanned(t, call_id, tool, input)\n   AND Classify(t, call_id, \"action_class\", \"defense_evasion\")\n   AND Classify(t, call_id, \"evasion_kind\", \"obfuscation\"))\n  IMPLIES:R Warn(t, \"tool\", \"obfuscation\", \"token/encoding obfuscation flagged\"))\n}\n\nAND\n\n{\"masquerade\"}{\nALWAYS\
    \ (FORALL t, call_id, tool, input.\n  (PolicyActive(t, \"defense_evasion_v1\")\n   AND ToolPlanned(t, call_id, tool, input)\n   AND Classify(t, call_id, \"evasion_kind\", \"masquerade\"))\n  IMPLIES:R Block(t, \"tool\", \"masquerade\", \"renaming a binary to a hidden/system-looking name to evade detection\"))\n}\n"
- id: credential_v1
  enabled: true
  mfotl: "{\"credential_read_for_requested_disclosure\"}{\nALWAYS (FORALL t, rid, s, call_id, tool, input.\n  (PolicyActive(t, \"credential_v1\")\n   AND Turn(t, rid, s)\n   AND ToolPlanned(t, call_id, tool, input)\n   AND Classify(t, call_id, \"credential_operation\", \"file_read\")\n   AND ONCE [0, 600] (EXISTS t2, r2, content, n.\n        Turn(t2, r2, s)\n        AND NOT (t = t2)\n        AND Message(t2, \"user\", content, n)\n        AND requests_exact_secret_disclosure(content) > 0.5))\n  IMPLIES:R Block(t, \"tool\", \"credential_read_for_requested_disclosure\", \"credential file read follows an explicit request to disclose exact secret values\"))\n}\n\nAND\n\n{\"credential_echo\"}{\nALWAYS (FORALL t, call_id, content, exit_code.\n  (PolicyActive(t, \"credential_v1\")\n   AND ToolResult(t, call_id, content, exit_code)\n   AND Classify(t, call_id, \"content_risk\", \"secret_material\"))\n  IMPLIES:R Warn(t, \"tool\", \"credential_echo\", \"plaintext secret material in tool result; advisory\
    \ only, a standalone read is dual-use, the harmful send is Blocked by the sensitive_exfiltration and untrusted_authorization egress joins\"))\n}\n\nAND\n\n{\"credential_file_access\"}{\nALWAYS (FORALL t, call_id, tool, input.\n  (PolicyActive(t, \"credential_v1\")\n   AND ToolPlanned(t, call_id, tool, input)\n   AND Classify(t, call_id, \"path_sensitivity\", \"credentials\")\n   AND Classify(t, call_id, \"tool_family\", \"file\"))\n  IMPLIES:R Approve(t, \"tool\", \"credential_file_access\"))\n}\n\nAND\n\n{\"credential_sweep\"}{\nALWAYS (FORALL t, call_id, tool, input.\n  (PolicyActive(t, \"credential_v1\")\n   AND ToolPlanned(t, call_id, tool, input)\n   AND Classify(t, call_id, \"path_sensitivity\", \"credentials\")\n   AND (Classify(t, call_id, \"tool_family\", \"search\")\n        OR Classify(t, call_id, \"tool_family\", \"shell\")))\n  IMPLIES:R Approve(t, \"tool\", \"credential_sweep\"))\n}\n\nAND\n\n{\"credential_access_command\"}{\nALWAYS (FORALL t, call_id, tool, input.\n  (PolicyActive(t,\
    \ \"credential_v1\")\n   AND ToolPlanned(t, call_id, tool, input)\n   AND Classify(t, call_id, \"action_class\", \"credential_access\")\n   AND Classify(t, call_id, \"tool_family\", \"shell\"))\n  IMPLIES:R Approve(t, \"tool\", \"credential_access_command\"))\n}\n\nAND\n\n{\"credential_harvest\"}{\nALWAYS (FORALL t, rid, s, call_id, tool, input.\n  (PolicyActive(t, \"credential_v1\")\n   AND Turn(t, rid, s)\n   AND ToolPlanned(t, call_id, tool, input)\n   AND Classify(t, call_id, \"action_class\", \"credential_access\")\n   AND (EXISTS ccnt.\n        ccnt <- CNT(t2; s;\n             ONCE [0, 600] (EXISTS r2, c2, tool2, input2.\n                  PolicyActive(t2, \"credential_v1\")\n                  AND Turn(t2, r2, s)\n                  AND ToolPlanned(t2, c2, tool2, input2)\n                  AND Classify(t2, c2, \"action_class\", \"credential_access\")))\n        AND ccnt >= 3))\n  IMPLIES:R Approve(t, \"tool\", \"credential_harvest\"))\n}\n"
- id: discovery_v2
  enabled: true
  mfotl: "{\"system_read_warn\"}{\nALWAYS (FORALL t, call_id, tool, input.\n  (PolicyActive(t, \"discovery_v2\")\n   AND ToolPlanned(t, call_id, tool, input)\n   AND Classify(t, call_id, \"system_read\", \"warn\"))\n  IMPLIES:R Warn(t, \"tool\", \"system_read\", \"read of a mildly-revealing system file (allowed, noted)\"))\n}\n\nAND\n\n{\"credential_discovery\"}{\nALWAYS (FORALL t, call_id, tool, input.\n  (PolicyActive(t, \"discovery_v2\")\n   AND ToolPlanned(t, call_id, tool, input)\n   AND Classify(t, call_id, \"path_sensitivity\", \"credentials\")\n   AND (Classify(t, call_id, \"tool_family\", \"search\")\n        OR Classify(t, call_id, \"tool_family\", \"shell\")))\n  IMPLIES:R Approve(t, \"tool\", \"credential_discovery\"))\n}\n\nAND\n\n{\"credential_file_access\"}{\nALWAYS (FORALL t, call_id, tool, input.\n  (PolicyActive(t, \"discovery_v2\")\n   AND ToolPlanned(t, call_id, tool, input)\n   AND Classify(t, call_id, \"path_sensitivity\", \"credentials\")\n   AND Classify(t, call_id,\
    \ \"tool_family\", \"file\"))\n  IMPLIES:R Approve(t, \"tool\", \"credential_file_access\"))\n}\n\nAND\n\n{\"discovery_accumulation_warn\"}{\nALWAYS (FORALL t, rid, s, call_id, tool, input.\n  (PolicyActive(t, \"discovery_v2\")\n   AND Turn(t, rid, s)\n   AND ToolPlanned(t, call_id, tool, input)\n   AND Classify(t, call_id, \"action_class\", \"discovery\")\n   AND NOT Classify(t, call_id, \"probe_scope\", \"local_diagnostic\")\n   AND (EXISTS dcnt.\n        dcnt <- CNT(t2; s;\n             ONCE [0, 600] (EXISTS r2, c2, tool2, input2.\n                  PolicyActive(t2, \"discovery_v2\")\n                  AND Turn(t2, r2, s)\n                  AND ToolPlanned(t2, c2, tool2, input2)\n                  AND Classify(t2, c2, \"action_class\", \"discovery\")\n                  AND NOT Classify(t2, c2, \"probe_scope\", \"local_diagnostic\")))\n        AND dcnt >= 3\n        AND dcnt < 10))\n  IMPLIES:R Warn(t, \"tool\", \"discovery_accumulation\", \"three to nine discovery probes in the last\
    \ 10 minutes\"))\n}\n\nAND\n\n{\"discovery_accumulation_block\"}{\nALWAYS (FORALL t, rid, s, call_id, tool, input.\n  (PolicyActive(t, \"discovery_v2\")\n   AND Turn(t, rid, s)\n   AND ToolPlanned(t, call_id, tool, input)\n   AND Classify(t, call_id, \"action_class\", \"discovery\")\n   AND NOT Classify(t, call_id, \"probe_scope\", \"local_diagnostic\")\n   AND (EXISTS dcnt.\n        dcnt <- CNT(t2; s;\n             ONCE [0, 600] (EXISTS r2, c2, tool2, input2.\n                  PolicyActive(t2, \"discovery_v2\")\n                  AND Turn(t2, r2, s)\n                  AND ToolPlanned(t2, c2, tool2, input2)\n                  AND Classify(t2, c2, \"action_class\", \"discovery\")\n                  AND NOT Classify(t2, c2, \"probe_scope\", \"local_diagnostic\")))\n        AND dcnt >= 10))\n  IMPLIES:R Block(t, \"tool\", \"discovery_accumulation\", \"ten or more discovery probes in the last 10 minutes\"))\n}\n"
- id: discovery_suppression_demo
