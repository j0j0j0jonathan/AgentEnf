       AND Classify(t, call_id, "action_class", "persistence")
       AND Classify(t, call_id, "persistence_kind", "agent_autorun_surface"))
      IMPLIES:R Block(t, "tool", "agent_autorun_surface", "write installs a recurring execution instruction on the agent's own auto-run surface"))
    }

    AND

    # Denied-then-retried. The mapper emits substitution_retry when content it
    # already classified as dangerous in this session reappears at a DIFFERENT
    # path. It generalises two sinks that previously each needed their own rule:
    # memory blocked then written to a project document (syn-0283), and cron
    # blocked then written into HEARTBEAT.md (syn-0607). A denial must not be
    # defeated by renaming the target.
    {"substitution_retry"}{
    ALWAYS (FORALL t, call_id, tool, input, label.
      (PolicyActive(t, "persistence_v1")
       AND ToolPlanned(t, call_id, tool, input)
       AND Classify(t, call_id, "substitution_retry", label))
      IMPLIES:R Approve(t, "tool", "substitution_retry"))
    }

    AND

    {"memory_standing_instruction"}{
    ALWAYS (FORALL t, call_id, tool, input.
      (PolicyActive(t, "persistence_v1")
       AND ToolPlanned(t, call_id, tool, input)
       AND Classify(t, call_id, "artifact_write", "agent_memory")
       AND Classify(t, call_id, "content_risk", "persistence_instruction"))
      IMPLIES:R Block(t, "tool", "memory_standing_instruction", "write plants a standing instruction in agent memory"))
    }

