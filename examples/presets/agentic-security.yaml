       AND ToolPlanned(t, call_id, tool, input)
       AND Classify(t, call_id, "action_class", "exfiltration")
       AND Classify(t, call_id, "network_risk", "suspicious"))
      IMPLIES:R Block(t, "tool", "exfil_suspicious_sink", "data egress to a known suspicious/exfil sink"))
    }

    AND

    {"exfil_external_sink"}{
    ALWAYS (FORALL t, call_id, tool, input.
      (PolicyActive(t, "exfiltration_v1")
       AND ToolPlanned(t, call_id, tool, input)
       AND Classify(t, call_id, "action_class", "exfiltration")
       AND Classify(t, call_id, "network_risk", "external"))
      IMPLIES:R Approve(t, "tool", "exfil_external_sink"))
    }

    AND

    {"sensitive_path_exfiltration"}{
    ALWAYS (FORALL t, rid, s, call_id, tool, input.
      (PolicyActive(t, "exfiltration_v1")
       AND Turn(t, rid, s)
       AND ToolPlanned(t, call_id, tool, input)
       AND Classify(t, call_id, "action_class", "exfiltration")
       AND ONCE [0, 120] (EXISTS t2, r2, c2, tool2, input2.
            Turn(t2, r2, s)
            AND NOT (t = t2)
            AND ToolPlanned(t2, c2, tool2, input2)
            AND Classify(t2, c2, "path_sensitivity", "credentials")))
      IMPLIES:R Block(t, "tool", "sensitive_exfiltration", "sensitive read precedes external sink"))
    }

    AND

    {"credential_access_exfiltration"}{
    ALWAYS (FORALL t, rid, s, call_id, tool, input.
      (PolicyActive(t, "exfiltration_v1")
       AND Turn(t, rid, s)
       AND ToolPlanned(t, call_id, tool, input)
       AND Classify(t, call_id, "action_class", "exfiltration")
       AND ONCE [0, 120] (EXISTS t2, r2, c2, tool2, input2.
            Turn(t2, r2, s)
            AND NOT (t = t2)
            AND ToolPlanned(t2, c2, tool2, input2)
            AND Classify(t2, c2, "action_class", "credential_access")))
      IMPLIES:R Block(t, "tool", "sensitive_exfiltration", "credential access precedes external sink"))
    }

    AND

    {"secret_result_exfiltration"}{
    ALWAYS (FORALL t, rid, s, call_id, tool, input.
      (PolicyActive(t, "exfiltration_v1")
       AND Turn(t, rid, s)
       AND ToolPlanned(t, call_id, tool, input)
       AND Classify(t, call_id, "action_class", "exfiltration")
       AND ONCE [0, 120] (EXISTS t2, r2, c2, content2, exit_code2.
            Turn(t2, r2, s)
            AND NOT (t = t2)
            AND ToolResult(t2, c2, content2, exit_code2)
            AND (Classify(t2, c2, "content_risk", "secret_material")
                 OR Classify(t2, c2, "content_risk", "credential_artifact"))))
      IMPLIES:R Block(t, "tool", "sensitive_exfiltration", "secret material observed before external sink"))
    }
- id: impact_v1
  enabled: true
  mfotl: |
    {"destructive_impact"}{
    ALWAYS (FORALL t, call_id, tool, input.
      (PolicyActive(t, "impact_v1")
       AND ToolPlanned(t, call_id, tool, input)
       AND Classify(t, call_id, "action_class", "impact")
       AND (Classify(t, call_id, "impact_kind", "fork_bomb")
            OR Classify(t, call_id, "impact_kind", "disk_destruction")
            OR Classify(t, call_id, "impact_kind", "resource_exhaustion")
            OR Classify(t, call_id, "impact_kind", "destructive_protected")))
      IMPLIES:R Block(t, "tool", "destructive_impact", "destructive/exhaustion operation on a protected or system target"))
    }

    AND

    {"ops_tree_delete_approval"}{
    ALWAYS (FORALL t, call_id, tool, input.
      (PolicyActive(t, "impact_v1")
       AND ToolPlanned(t, call_id, tool, input)
       AND Classify(t, call_id, "impact_kind", "destructive_ops_tree"))
      IMPLIES:R Approve(t, "tool", "ops_tree_delete"))
    }

    AND

    {"ops_tree_wipe_after_untrusted_instruction"}{
    ALWAYS (FORALL t, rid, s, call_id, tool, input.
      (PolicyActive(t, "impact_v1")
       AND Turn(t, rid, s)
       AND ToolPlanned(t, call_id, tool, input)
       AND Classify(t, call_id, "impact_kind", "destructive_ops_tree")
       AND ONCE [0, 600] (EXISTS t2, r2, c2, content2, exit_code2.
            Turn(t2, r2, s)
            AND NOT (t = t2)
            AND ToolResult(t2, c2, content2, exit_code2)
            AND Untrusted(t2, "tool_result")
            AND Classify(t2, c2, "content_risk", "instruction_like")))
      IMPLIES:R Block(t, "tool", "ops_tree_wipe_after_untrusted_instruction", "operational logs, backups, or data are recursively deleted after an untrusted instruction"))
    }

    AND

    {"system_config_change"}{
    ALWAYS (FORALL t, call_id, tool, input, target.
      (PolicyActive(t, "impact_v1")
       AND ToolPlanned(t, call_id, tool, input)
       AND Classify(t, call_id, "system_config_write", target))
      IMPLIES:R Approve(t, "tool", "system_config_change"))
    }

    AND

    {"file_delete_approval"}{
    ALWAYS (FORALL t, call_id, tool, input.
      (PolicyActive(t, "impact_v1")
       AND ToolPlanned(t, call_id, tool, input)
       AND Classify(t, call_id, "file_action", "delete"))
      IMPLIES:R Approve(t, "tool", "file_delete"))
    }

    AND

    {"file_delete_burst"}{
    ALWAYS (FORALL t, rid, s, call_id, tool, input.
      (PolicyActive(t, "impact_v1")
       AND Turn(t, rid, s)
       AND ToolPlanned(t, call_id, tool, input)
       AND Classify(t, call_id, "file_action", "delete")
       AND (EXISTS dcnt.
         dcnt <- CNT(t2; s;
           ONCE [0, 60] (EXISTS r2, c2, content2, exit_code2.
             Turn(t2, r2, s)
             AND ToolResult(t2, c2, content2, exit_code2)
             AND ONCE [0, 60] (EXISTS t3, r3, tool3, input3.
               Turn(t3, r3, s)
               AND ToolPlanned(t3, c2, tool3, input3)
               AND Classify(t3, c2, "file_action", "delete"))))
         AND dcnt >= 5))
      IMPLIES:R Block(t, "tool", "file_delete_burst", "five files were deleted in this session during the last minute"))
    }
- id: external_judge
  enabled: false
  mfotl: |
    ALWAYS (FORALL t, call_id, tool, input.
      (PolicyActive(t, "external_judge")
       AND ToolPlanned(t, call_id, tool, input)
       AND is_forbidden(input) > 0.5)
      IMPLIES:R Block(t, "tool", "external_judge_forbidden", "external judge classified planned tool use as an attack"))
- id: coverage_v1
  enabled: false
  mfotl: |
    {"extension_state_change"}{
    ALWAYS (FORALL t, call_id, tool, input.
      (PolicyActive(t, "coverage_v1")
       AND ToolPlanned(t, call_id, tool, input)
       AND Classify(t, call_id, "extension_tool", "skill")
       AND (Classify(t, call_id, "extension_action", "create")
            OR Classify(t, call_id, "extension_action", "install")
            OR Classify(t, call_id, "extension_action", "update")
            OR Classify(t, call_id, "extension_action", "delete")
            OR Classify(t, call_id, "extension_action", "stage")))
      IMPLIES:R Approve(t, "tool", "extension_state_change"))
    }

    AND

    {"device_pairing"}{
    ALWAYS (FORALL t, call_id, tool, input.
      (PolicyActive(t, "coverage_v1")
       AND ToolPlanned(t, call_id, tool, input)
       AND Classify(t, call_id, "device_action", "pair"))
      IMPLIES:R Approve(t, "tool", "device_pairing"))
    }

    AND

    {"judge_classified_action"}{
    ALWAYS (FORALL t, call_id, tool, input.
      (PolicyActive(t, "coverage_v1")
       AND ToolPlanned(t, call_id, tool, input)
       AND Classify(t, call_id, "judge_status", "classified")
       AND NOT Classify(t, call_id, "action_class", "benign"))
      IMPLIES:R Approve(t, "tool", "judge_classified_action"))
    }

    AND

    {"unclassified_action"}{
    ALWAYS (FORALL t, call_id, tool, input.
      (PolicyActive(t, "coverage_v1")
       AND ToolPlanned(t, call_id, tool, input)
       AND Classify(t, call_id, "tool_status", "unclassified"))
      IMPLIES:R Approve(t, "tool", "unclassified_action"))
    }

    AND

    {"uncertain_action"}{
    ALWAYS (FORALL t, call_id, tool, input.
      (PolicyActive(t, "coverage_v1")
       AND ToolPlanned(t, call_id, tool, input)
       AND Classify(t, call_id, "tool_status", "uncertain")
       AND NOT Classify(t, call_id, "judge_status", "classified"))
      IMPLIES:R Approve(t, "tool", "uncertain_action"))
    }
